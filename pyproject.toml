[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oura-personalization-dashboard"
version = "0.1.0"
description = "Local Oura Ring recovery and personalization dashboard."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dashboard = [
    "pandas>=2.0",
    "plotly>=5.20",
    "streamlit>=1.35",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
oura-dashboard = "oura_dashboard.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
